services:
  app:
    build: .
    container_name: simplepayroll-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      - db
    ports:
      - "3000:3000"
  db:
    image: mysql:8.0
    container_name: simplepayroll-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-change_me_root_password}
      MYSQL_DATABASE: ${DB_NAME:-simple_payroll}
      MYSQL_USER: ${DB_USER:-payroll_user}
      MYSQL_PASSWORD: ${DB_PASS:-change_me_root_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
  caddy:
    image: caddy:2-alpine
    container_name: simplepayroll-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    profiles:
      - prod
volumes:
  db_data:
  caddy_data:
  caddy_config:
