services:
  - type: web
    name: simplepayroll
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: simple_payroll
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: 4000
    region: singapore
